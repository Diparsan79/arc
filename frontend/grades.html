<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ARC — Grades</title>
    <link rel="stylesheet" href="/static/style.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link rel="icon" type="image/svg+xml" href="/static/favicon.svg">
</head>
<body>

        <nav>
        <span class="nav-logo">ARC</span>
        <div class="nav-links">
            <a href="/index.html"><svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7"></rect><rect x="14" y="3" width="7" height="7"></rect><rect x="14" y="14" width="7" height="7"></rect><rect x="3" y="14" width="7" height="7"></rect></svg> dashboard</a>
            <a href="/timer.html"><svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"></circle><polyline points="12 6 12 12 16 14"></polyline></svg> timer</a>
            <a href="/subjects.html"><svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"></path><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"></path></svg> subjects</a>
            <a href="/history.html"><svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 8v4l3 3"></path><path d="M3.05 11a9 9 0 1 1 .5 4"></path><polyline points="3 6 3 11 8 11"></polyline></svg> history</a>
            <a href="/insights.html"><svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="22 12 18 12 15 21 9 3 6 12 2 12"></polyline></svg> insights</a>
            <a href="/grades.html" class="active"><svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"></path><polyline points="22 4 12 14.01 9 11.01"></polyline></svg> grades</a>
        </div>
    </nav>

    <main>

        <div class="section">
            <div class="section-label">upcoming exams</div>
            <div id="examCountdown">
                <div class="empty-state">no exams scheduled</div>
            </div>
        </div>

        <div class="section">
            <div class="section-label">schedule an exam</div>
            <div class="card">
                <div class="form-row">
                    <div class="form-group">
                        <label>subject</label>
                        <select id="examSubject"></select>
                    </div>
                    <div class="form-group">
                        <label>label</label>
                        <input type="text" id="examLabel" placeholder="e.g. Unit 3 Final">
                    </div>
                    <div class="form-group">
                        <label>date</label>
                        <input type="date" id="examDate">
                    </div>
                </div>
                <button class="btn-primary" id="addExamBtn">schedule</button>
                <div id="examStatus" class="status hidden"></div>
            </div>
        </div>

        <div class="section">
            <div class="section-label">study hours vs grade</div>
            <div class="card">
                <canvas id="correlationChart" height="200"></canvas>
                <div class="correlation-note">
                    each dot is one exam — hours studied in the 2 weeks before
                </div>
            </div>
        </div>

        <div class="section">
            <div class="section-label">log a grade</div>
            <div class="card">
                <div class="form-row">
                    <div class="form-group">
                        <label>subject</label>
                        <select id="gradeSubject"></select>
                    </div>
                    <div class="form-group">
                        <label>label</label>
                        <input type="text" id="gradeLabel" placeholder="e.g. Mid-term">
                    </div>
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label>score</label>
                        <input type="number" id="gradeScore" placeholder="78" min="0">
                    </div>
                    <div class="form-group">
                        <label>out of</label>
                        <input type="number" id="gradeMax" placeholder="100" min="1">
                    </div>
                    <div class="form-group">
                        <label>type</label>
                        <select id="gradeType">
                            <option value="test">test</option>
                            <option value="exam">exam</option>
                            <option value="assignment">assignment</option>
                            <option value="quiz">quiz</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>date</label>
                        <input type="date" id="gradeDate">
                    </div>
                </div>
                <button class="btn-primary" id="addGradeBtn">log grade</button>
                <div id="gradeStatus" class="status hidden"></div>
            </div>
        </div>

        <div class="section">
            <div class="section-label">grade history</div>
            <div id="gradeList">
                <div class="empty-state">no grades logged yet</div>
            </div>
        </div>

    </main>

    <script src="/static/grade.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ARC — Timer</title>
    <link rel="stylesheet" href="/static/style.css?v=2">
    <link rel="icon" type="image/svg+xml" href="/static/favicon.svg">
</head>

<body>

    <nav>
        <span class="nav-logo">ARC</span>
        <div class="nav-links">
            <a href="/index.html"><svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor"
                    stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <rect x="3" y="3" width="7" height="7"></rect>
                    <rect x="14" y="3" width="7" height="7"></rect>
                    <rect x="14" y="14" width="7" height="7"></rect>
                    <rect x="3" y="14" width="7" height="7"></rect>
                </svg> dashboard</a>
            <a href="/timer.html" class="active"><svg viewBox="0 0 24 24" width="14" height="14" fill="none"
                    stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="12" cy="12" r="10"></circle>
                    <polyline points="12 6 12 12 16 14"></polyline>
                </svg> timer</a>
            <a href="/subjects.html"><svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor"
                    stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"></path>
                    <path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"></path>
                </svg> subjects</a>
            <a href="/history.html"><svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor"
                    stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M12 8v4l3 3"></path>
                    <path d="M3.05 11a9 9 0 1 1 .5 4"></path>
                    <polyline points="3 6 3 11 8 11"></polyline>
                </svg> history</a>
            <a href="/insights.html"><svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor"
                    stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <polyline points="22 12 18 12 15 21 9 3 6 12 2 12"></polyline>
                </svg> insights</a>
            <a href="/grades.html"><svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor"
                    stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"></path>
                    <polyline points="22 4 12 14.01 9 11.01"></polyline>
                </svg> grades</a>
        </div>
    </nav>

    <main>

        <!-- subject selection-->
        <div id="setupPhase">
            <div class="page-header">
                <h1>what are you studying?</h1>
                <p class="subtitle">pick a subject to start the timer</p>
            </div>

            <div class="card">
                <div class="form-group">
                    <label for="timerSubject">subject</label>
                    <select id="timerSubject">
                        <option value="">loading...</option>
                    </select>
                </div>
                <button class="btn-primary" id="startBtn">start session</button>
            </div>
        </div>

        <!-- Timer -->
        <div id="timerPhase" class="hidden">
            <div class="timer-container">
                <div class="timer-subject" id="timerSubjectName"></div>
                <div class="timer-display" id="timerDisplay">00:00:00</div>
                <div class="timer-controls">
                    <button class="btn-secondary" id="pauseBtn">pause</button>
                    <button class="btn-danger" id="stopBtn">stop</button>
                </div>
                <div class="timer-status" id="timerStatus">studying...</div>
            </div>
        </div>

        <!-- Session Form  -->
        <div id="logPhase" class="hidden">
            <div class="page-header">
                <h1>session complete</h1>
                <p class="subtitle" id="sessionSummary"></p>
            </div>

            <div class="card">
                <div class="form-group">
                    <label>duration</label>
                    <input type="number" id="logDuration" min="1" readonly>
                    <span class="field-hint">minutes</span>
                </div>

                <div class="form-group">
                    <label>how was your focus?</label>
                    <span class="field-hint" style="display:block;margin-bottom:0.5rem;color:#888;">1 = totally distracted, 5 = deep flow state</span>
                    <div class="focus-selector" id="logFocusSelector">
                        <button class="focus-btn" data-value="1">1</button>
                        <button class="focus-btn" data-value="2">2</button>
                        <button class="focus-btn" data-value="3">3</button>
                        <button class="focus-btn" data-value="4">4</button>
                        <button class="focus-btn" data-value="5">5</button>
                    </div>
                    <input type="hidden" id="logFocusRating" value="">
                </div>

                <div class="form-group">
                    <label>what did you cover?</label>
                    <textarea id="logNotes" placeholder="e.g. Chapter 5 — thermodynamics, practiced 10 problems..."
                        rows="3"></textarea>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label>where?</label>
                        <select id="logLocation">
                            <option value="home">home</option>
                            <option value="library">library</option>
                            <option value="school">school</option>
                            <option value="outside">outside</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label>distractions?</label>
                        <input type="text" id="logDistractions" placeholder="e.g. phone, youtube, noisy room...">
                    </div>
                </div>

                <div class="form-actions">
                    <button class="btn-primary" id="saveSessionBtn">save session</button>
                    <button class="btn-ghost" id="discardBtn">discard</button>
                </div>

                <div id="logStatus" class="status hidden"></div>
            </div>
        </div>

    </main>

    <!-- Toast Notification -->
    <div id="toast" class="toast hidden">
        session saved successfully!
    </div>

    <script src="/static/timer.js?v=2"></script>
</body>

</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ARC - History</title>
    <link rel="stylesheet" href="/static/style.css?v=2">
    <link rel="icon" type="image/svg+xml" href="/static/favicon.svg">
</head>
<body>
        <nav>
        <span class="nav-logo">ARC</span>
        <div class="nav-links">
            <a href="/index.html"><svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7"></rect><rect x="14" y="3" width="7" height="7"></rect><rect x="14" y="14" width="7" height="7"></rect><rect x="3" y="14" width="7" height="7"></rect></svg> dashboard</a>
            <a href="/timer.html"><svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"></circle><polyline points="12 6 12 12 16 14"></polyline></svg> timer</a>
            <a href="/subjects.html"><svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"></path><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"></path></svg> subjects</a>
            <a href="/history.html" class="active"><svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 8v4l3 3"></path><path d="M3.05 11a9 9 0 1 1 .5 4"></path><polyline points="3 6 3 11 8 11"></polyline></svg> history</a>
            <a href="/insights.html"><svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="22 12 18 12 15 21 9 3 6 12 2 12"></polyline></svg> insights</a>
            <a href="/grades.html"><svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"></path><polyline points="22 4 12 14.01 9 11.01"></polyline></svg> grades</a>
        </div>
    </nav>
    
    <main>
        <div class="section">
            <div class="stats-bar" id="statsBar">
                <div class="stat-pill">
                    <span class="stat-val" id="totalSessions">—</span>
                    <span class="stat-lbl">sessions</span>
                </div>
                <div class="stat-pill">
                    <span class="stat-val" id="totalHours">—</span>
                    <span class="stat-lbl">total hours</span>
                </div>
                <div class="stat-pill">
                    <span class="stat-val" id="avgFocus">—</span>
                    <span class="stat-lbl">avg focus</span>
                </div>
                <div class="stat-pill">
                    <span class="stat-val" id="avgDuration">—</span>
                    <span class="stat-lbl">avg session</span>
                </div>
            </div>
        </div>
        <div class="section">
            <div class="section-label">filter</div>
            <div class="card">
                <div class="form-row">
                    <div class="form-group">
                        <label>subject</label>
                        <select id="filterSubject">
                            <option value="">all subjects</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>from</label>
                        <input type="date" id="filterFrom">
                    </div>
                    <div class="form-group">
                        <label>to</label>
                        <input type="date" id="filterTo">
                    </div>
                </div>
                <div class="form-actions">
                    <button class="btn-primary" id="applyFilter">apply</button>
                    <button class="btn-ghost" id="clearFilter">clear</button>
                </div>
            </div>
        </div>

        <div class="section">
            <div class="section-label">sessions</div>
            <div id="sessionList">
                <div class="empty-state">loading...</div>
            </div>
        </div>
    </main>
    <script sr="/static/history.js?v=2"></script>
</body>
</html>
